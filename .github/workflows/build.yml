name: Compilar APK Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python e Java
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            openjdk-17-jdk

    - name: Instalar Buildozer e dependências Python
      run: |
        pip install --upgrade pip
        pip install --user Cython==0.29.33 buildozer

    - name: Adicionar binários do usuário ao PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Aceitar licenças e preparar o Android SDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a43b6806230452627e324e95dce3719c8" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Rodar Buildozer para gerar o APK
      run: |
        buildozer -v android debug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-apk-cantina
        path: bin/*.apk
